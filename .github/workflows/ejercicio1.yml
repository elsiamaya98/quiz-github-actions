name: Ejercicio 1

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir mi nombre
        run: |
          echo "Hola, mi nombre es Elsi Amaya"

      - name: Imprimir fecha y hora
        run: |
          date

      - name: Imprimir sistema operativo del runner
        run: |
          echo "Sistema operativo: $RUNNER_OS"

